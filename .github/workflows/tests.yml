name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app
      - name: Run tests
        run: |
          xcodebuild test \
            -project Daftar.xcodeproj \
            -scheme Daftar \
            -destination 'platform=macOS'
